<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Record, edit and transcribe">
<style>
.meter{transform-box:fill-box;transform-origin:left center;animation:m 1s ease-in-out infinite alternate}
@keyframes m{0%{transform:scaleX(.15)}60%{transform:scaleX(.72)}100%{transform:scaleX(.45)}}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 1.6s ease-in-out infinite}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.3}}
.sel{animation:sel 4s cubic-bezier(.22,1,.36,1) infinite}
@keyframes sel{0%{opacity:0;transform:translateX(-30px)}25%,80%{opacity:1;transform:none}100%{opacity:0}}
.scan{animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(306px)}}
.type{transform-box:fill-box;transform-origin:left center;animation:type 5s cubic-bezier(.22,1,.36,1) infinite}
.t1{animation-delay:.5s}.t2{animation-delay:1s}.t3{animation-delay:1.5s}
@keyframes type{0%{transform:scaleX(0);opacity:0}20%,85%{transform:scaleX(1);opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
