<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Sonora Sound Recorder">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B3840"/><stop offset="1" stop-color="#1D262C"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F8F8FF" stop-opacity="0"/><stop offset=".18" stop-color="#F8F8FF" stop-opacity=".85"/>
    <stop offset=".85" stop-color="#F8F8FF" stop-opacity=".85"/><stop offset="1" stop-color="#F8F8FF" stop-opacity=".15"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1200" height="380" rx="28"/></clipPath>
</defs>
<style>
.bar{fill:url(#fade);transform-box:fill-box;transform-origin:center;animation:bar 1.2s ease-in-out infinite alternate}
@keyframes bar{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
.head{animation:head 6s linear infinite}
@keyframes head{from{transform:translateX(0)}to{transform:translateX(550px)}}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 1.6s ease-in-out infinite}
@keyframes dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
.rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
.r2{animation-delay:.12s}.r3{animation-delay:.24s}.r4{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.lb{transform-box:fill-box;transform-origin:center;animation:lb 1.4s ease-in-out infinite alternate}
.l1{animation-delay:-.2s}.l2{animation-delay:-.7s}.l3{animation-delay:-.1s}.l4{animation-delay:-.9s}.l5{animation-delay:-.4s}
@keyframes lb{from{transform:scaleY(.55)}to{transform:scaleY(1.08)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
